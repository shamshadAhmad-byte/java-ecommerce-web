jwt.secret=${SECRET_KEY}

# ===============================
# CLOUDINARY
# ===============================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dgsvfcjgn}

cloudinary.api-key=${CLOUDINARY_API_KEY}

cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# ===============================
# MULTIPART
# ===============================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=50MB

# ===============================
# STRIPE
# ===============================

stripe.api.key=${STRIPE_SECRET_KEY}
stripe.currency=${STRIPE_CURRENCY:inr}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:5174/verify?session_id={CHECKOUT_SESSION_ID}}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:5174/cart}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
